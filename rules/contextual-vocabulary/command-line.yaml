id: command-line
label: command line / command-line
vale_check: Lab.ContextualCommandLine
source:
  guide: Google developer documentation style guide
  url: https://developers.google.com/style/hyphens
  rationale: Compound modifiers before nouns are hyphenated; ordinary noun phrases are open.
question: Is the marked term directly modifying the noun that follows it, standing as its own phrase, or being reproduced literally?
variants:
  - command line
  - command-line
contexts:
  standalone:
    description: There is no separate noun immediately after the closing ⟧ marker that the marked term modifies. The next word might instead be a verb, preposition, or punctuation, as in the command line changed or on the command line.
    expected: command line
  before_noun:
    description: A separate noun appears immediately after the closing ⟧ marker, and the marked term modifies that noun, as in ⟦command-line⟧ tool, ⟦command-line⟧ interface, or ⟦command-line⟧ argument.
    expected: command-line
  literal:
    description: The term reproduces code, a UI label, a quotation, or an official name that must be preserved.
    preserve: true
  ambiguous:
    description: The passage is incomplete and does not reveal whether a following noun is being modified.
review_at: 0.55
flag_at: 0.85
